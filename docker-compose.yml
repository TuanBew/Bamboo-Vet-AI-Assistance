name: bamboo-vet-prod

services:

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    networks:
      - bamboo-net
    depends_on:
      next-app:
        condition: service_healthy

  next-app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are baked into the browser bundle at build time — must be ARG
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    env_file: .env
    networks:
      - bamboo-net
    depends_on:
      mcp-server:
        condition: service_healthy

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    networks:
      - bamboo-net
    # Maps host.docker.internal → host gateway so mcp-server can reach RAGflow on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Port 3100 intentionally NOT published — internal Docker network only

  duckdns-updater:
    image: alpine:3.19
    restart: unless-stopped
    env_file: .env
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache curl > /dev/null 2>&1
        while true; do
          result=$(curl -s "https://www.duckdns.org/update?domains=$$DUCKDNS_SUBDOMAIN&token=$$DUCKDNS_TOKEN&ip=")
          echo "[duckdns] $$result"
          sleep 300
        done
    networks:
      - bamboo-net

networks:
  bamboo-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
