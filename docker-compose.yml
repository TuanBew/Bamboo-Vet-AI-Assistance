name: bamboo-vet-prod

services:

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bamboo-cloudflared
    restart: unless-stopped
    # Token encodes tunnel identity and routing config — obtained from Cloudflare Zero Trust dashboard
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - bamboo-net
    depends_on:
      next-app:
        condition: service_healthy

  next-app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are baked into the browser bundle at build time — must be ARG
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    env_file: .env
    networks:
      - bamboo-net
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    networks:
      - bamboo-net
    # Maps host.docker.internal → host gateway so mcp-server can reach RAGflow on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Port 3100 intentionally NOT published — internal Docker network only

networks:
  bamboo-net:
    driver: bridge
