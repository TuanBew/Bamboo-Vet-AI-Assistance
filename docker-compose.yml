name: bamboo-vet-prod

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bamboo-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - bamboo-net
    depends_on:
      next-app:
        condition: service_healthy

  next-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    env_file: .env
    # FIX: Map port 3000 trên container ra port 3000 trên Windows host
    ports:
      - "3000:3000"
    networks:
      - bamboo-net
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    networks:
      - bamboo-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  bamboo-net:
    driver: bridge