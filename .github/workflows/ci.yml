name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  vercel-smoke:
    name: Vercel Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Run Vercel smoke tests (VRC-01 to VRC-09)
        run: npm run test:vercel
        env:
          VERCEL_TEST_EMAIL: ${{ secrets.VERCEL_TEST_EMAIL }}
          VERCEL_TEST_PASSWORD: ${{ secrets.VERCEL_TEST_PASSWORD }}
